name: CI

# Runs on every pull request. Pushes to main run it through the Lightsail deploy
# workflow (workflow_call), so production only deploys a green commit and main
# is not tested twice.
on:
  pull_request:
  workflow_call:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  node:
    name: Build, typecheck and Jest
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Same order as docker/Dockerfile.service: shared libraries first, then every
      # service. tsc runs as part of each build, so this is also the typecheck.
      - name: Build all workspaces
        run: |
          npm run build --workspace=@menumanager/internal-auth
          npm run build --workspace=@menumanager/supabase-client
          npm run build --workspace=@menumanager/tenant-config
          npm run build --workspace=@menumanager/llm-adapter
          npm run build --workspaces --if-present

      - name: Jest
        run: npx jest --ci

      - name: Business scenarios (Cucumber)
        run: npm run test:business

  python:
    name: docx-redliner tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: services/docx-redliner/requirements.txt

      - name: Install dependencies
        run: pip install -r services/docx-redliner/requirements.txt pytest

      - name: Pytest
        working-directory: services/docx-redliner
        run: python -m pytest -q
